[package]
name = "tendns"
version = "0.2.0"
edition = "2024"
rust-version = "1.96.1"
description = "Encrypted TXT discovery and hexadecimal IPv4 resolution, as a library and DNS server"
repository = "https://github.com/cfal/tendns"
license = "MIT"
readme = "README.md"
keywords = ["dns", "dns-over-https", "encryption", "discovery"]
categories = ["network-programming", "command-line-utilities"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "DESIGN.md", "LICENSE", "tendns.example.toml"]

[features]
default = ["cli"]
cli = [
    "dep:bytes", "dep:clap", "dep:hickory-resolver", "dep:hickory-server",
    "dep:humantime", "dep:http", "dep:http-body-util", "dep:hyper",
    "dep:hyper-util", "dep:reqwest", "dep:rustls", "dep:serde",
    "dep:serde_json", "dep:tokio-rustls", "dep:toml", "dep:url",
    "tokio/macros", "tokio/rt-multi-thread", "tokio/net", "tokio/signal", "tokio/io-util",
]

[[bin]]
name = "tendns"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
aws-lc-rs = { version = "1.19", default-features = false, features = ["alloc", "aws-lc-sys"] }
base64 = "0.22"
bytes = { version = "1.12", optional = true }
clap = { version = "4.6", features = ["derive"], optional = true }
hickory-proto = "0.26.3"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio", "https-aws-lc-rs", "webpki-roots"], optional = true }
hickory-server = { version = "0.26.3", default-features = false, optional = true }
humantime = { version = "2.4", optional = true }
http = { version = "1.5", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1.12", features = ["server", "http1", "http2"], optional = true }
hyper-util = { version = "0.1", features = ["server-auto", "tokio"], optional = true }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "query"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"], optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
tokio = { version = "1.54", features = ["sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"], optional = true }
toml = { version = "0.9", optional = true }
url = { version = "2.5", optional = true }
zeroize = "1.9"

[dev-dependencies]
tokio = { version = "1.54", features = ["macros", "test-util", "process", "rt", "io-util"] }
h2 = "0.4"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "aws_lc_rs"] }
tempfile = "3.27"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
opt-level = 3
lto = "fat"
strip = true
